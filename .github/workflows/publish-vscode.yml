name: Publish VS Code extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package and publish VSIX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: IDE/VsCode
        run: npm ci

      - name: Compile
        working-directory: IDE/VsCode
        run: npm run compile

      - name: Package VSIX
        working-directory: IDE/VsCode
        run: npx vsce package --allow-missing-repository

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: csx-vscode-vsix
          path: IDE/VsCode/*.vsix

      - name: Publish to Marketplace
        if: github.event_name == 'push'
        working-directory: IDE/VsCode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --allow-missing-repository -p "$VSCE_PAT"